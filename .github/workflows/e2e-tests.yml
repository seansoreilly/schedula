name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-and-build:
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:unit

    - name: Build application
      run: npm run build

  # Runs the Playwright suite against a throwaway local Supabase stack (Postgres
  # + PostgREST via `supabase start`, schema from supabase/migrations). It never
  # touches production: no secrets are used and the API server refuses
  # non-local databases.
  e2e:
    timeout-minutes: 60
    # Pinned: Playwright 1.55 can't install browsers on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - uses: supabase/setup-cli@v1
      with:
        version: 2.90.0

    - name: Start local Supabase (Postgres + PostgREST)
      run: >-
        supabase start
        -x gotrue,realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

    - name: Point the API at the local stack
      run: |
        supabase status -o env \
          | sed -n -e 's/^API_URL=/SUPABASE_URL=/p' -e 's/^ANON_KEY=/SUPABASE_ANON_KEY=/p' \
          | tr -d '"' > supabase-local.env
        grep -q '^SUPABASE_URL=.' supabase-local.env
        grep -q '^SUPABASE_ANON_KEY=.' supabase-local.env
        cat supabase-local.env >> "$GITHUB_ENV"

    - name: Check the schedula schema is served
      run: |
        curl --fail-with-body -sS "$SUPABASE_URL/rest/v1/meetings?select=id&limit=1" \
          -H "apikey: $SUPABASE_ANON_KEY" \
          -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
          -H "Accept-Profile: schedula"

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npm run test

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
