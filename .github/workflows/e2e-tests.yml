name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-and-build:
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:unit

    - name: Build application
      run: npm run build

  # The Playwright suite needs the API server on :3001, which CI doesn't start yet,
  # so it only runs on demand until that's wired up.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    # Pinned: Playwright 1.55 can't install browsers on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Build application
      run: npm run build

    - name: Run Playwright tests
      run: npm run test
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
