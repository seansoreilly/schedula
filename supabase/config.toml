# Local Supabase stack used by `supabase start` for development and the CI
# e2e job. This is NOT linked to production; never `supabase db push` from CI.
project_id = "iuqavetwmewaapayaruy"

[api]
enabled = true
port = 54321
# The API handlers query the `schedula` schema through PostgREST.
schemas = ["public", "graphql_public", "schedula"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[auth]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
